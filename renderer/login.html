<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seek Unique Timer — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Company favicon -->
  <link rel="icon" type="image/png" href="./seekuniquelogo.png" />
  <meta name="theme-color" content="#1e003d"/>
  <style>
    :root{ --bg1:#1e003d; --bg2:#4b0082; --text:#fff; --card:rgba(255,255,255,.1); --border:rgba(255,255,255,.14); }
    *{box-sizing:border-box} html,body{height:100%}
    body{
      margin:0;color:var(--text);font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,.08), transparent 40%),
        radial-gradient(1000px 700px at 90% 12%, rgba(255,255,255,.06), transparent 40%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      display:grid;place-items:center;overflow:hidden;
    }
    .scene{ perspective:1200px; width:100%; height:100%; display:grid;place-items:center; }
    .card{
      width:min(520px,92vw); border-radius:18px; padding:28px; text-align:center;
      background:rgba(255,255,255,.08); border:1px solid var(--border); backdrop-filter:blur(20px);
      box-shadow:0 40px 100px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.25);
      transform-style:preserve-3d; transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
      transition: transform .12s ease;
    }
    img.logo{
      height:80px;
      margin-bottom:12px;
      filter:drop-shadow(0 6px 16px rgba(0,0,0,.55));
    }
    h1{margin:10px 0 4px;font-size:28px}
    p{opacity:.9;margin:0 0 18px}
    button{
      border:none;border-radius:999px;padding:14px 18px;font-weight:800;letter-spacing:.2px;color:#fff;cursor:pointer;
      background:linear-gradient(135deg,#7c3aed,#a78bfa); width:100%; box-shadow:0 16px 40px rgba(124,58,237,.35);
    }
    small{display:block;margin-top:10px;opacity:.75}
    #msg{margin-top:10px;color:#ffd7d7;min-height:18px;font-size:14px}
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="card" id="card">
      <!-- Company Logo -->
      <img src="./seekuniquelogo.png" alt="Company Logo" style="height:60px; width:auto;" />

      <h1>Welcome back</h1>
      <p>Sign in to start tracking your time</p>
      <button id="btnLogin">Continue with Google</button>
      <small>Only company accounts are allowed</small>
      <div id="msg"></div>
    </div>
  </div>

  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./login.js"></script>
  <script>
    // Subtle 3D tilt
    const scene=document.getElementById('scene'); const card=document.getElementById('card');
    scene.addEventListener('mousemove', e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      const rx=(.5-y)*6, ry=(x-.5)*8;
      card.style.setProperty('--rx', rx+'deg');
      card.style.setProperty('--ry', ry+'deg');
    });
    scene.addEventListener('mouseleave', ()=>{
      card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg');
    });
  </script>
</body>
</html>
